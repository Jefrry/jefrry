name: jefrry-portfolio

services:
  site:
    image: ${SITE_IMAGE:-jefrry-portfolio:local}
    build:
      context: .
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-jefrry.dev}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
